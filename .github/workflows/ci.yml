name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: biome
        run: bun run check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: typescript
        run: bun run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: next build
        run: bun run build

  commits:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install dependencies
        run: bun install --frozen-lockfile
      - name: commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            bunx commitlint --last --verbose
          else
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi
